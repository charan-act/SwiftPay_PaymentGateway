spring.application.name=transaction_gateway

# ==========================
# Application
# ==========================


# ==========================
# PostgreSQL Configuration
# ==========================
spring.datasource.url=jdbc:postgresql://localhost:5432/transaction_gateway
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================
# Server
# ==========================
server.port=8080


#===========================
# REDIS
#============================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==========================================================
# Kafka Configuration
# ==========================================================

# Kafka Server
spring.kafka.bootstrap-servers=localhost:9092

# ---------------- Producer ----------------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ---------------- Consumer ----------------
spring.kafka.consumer.group-id=transaction-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Convert JSON back to Java Object
spring.kafka.consumer.properties.spring.json.trusted.packages=com.Swifty.transaction_gateway.event
# ==========================================================
# Logging
# ==========================================================
logging.level.org.springframework.kafka=INFO
logging.level.com.Swifty.transaction_gateway=DEBUG